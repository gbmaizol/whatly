# Flathub submission manifest for Whatly.
#
# This is the manifest to submit to https://github.com/flathub/flathub (see
# SUBMISSION.md next to this file). It differs from packaging/flatpak/ in the
# ways Flathub requires: every source is pinned to an immutable commit (no
# branches, no `dir` sources), and the libnotify-qt submodule is fetched as its
# own pinned git source instead of relying on a local checkout.
#
# Whatly's real Qt floor is 6.8 (QWebEnginePermission); it targets the KDE 6.10
# runtime (Qt 6.10), which matches the default floor, so no -DQT_VERSION_MINOR
# override is needed. Moved off 6.9 once that runtime went end-of-life (#111).
app-id: net.shakaran.whatly
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
command: whatly

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=all            # camera for video calls
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  # Read-only access to the standard media/document folders so files dragged
  # from a host file manager (which delivers a plain file:// path, not a portal
  # token) can be attached. Scoped to media dirs rather than the whole home to
  # keep the sandbox tight (issue #32).
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-music:ro

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # webenginedriver is the WebDriver server, for automating a browser from a test
  # harness. Nothing in the app launches it and no user can reach it, but it is a
  # 16 MB binary in every install. QtWebEngineProcess, beside it, is the renderer
  # helper and must stay.
  - rm -f /app/lib/libexec/webenginedriver

modules:
  - name: whatly
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      # The app, pinned to the 6.1.0 release commit. flatpak-builder fetches the
      # git source's submodules (libnotify-qt at src/libnotify-qt) automatically,
      # each at the commit the tag pins — no separate source needed.
      - type: git
        url: https://github.com/shakaran/whatly.git
        tag: v6.1.0
        commit: b201cd95dc65d854c9270237aa519c54b15549bb
